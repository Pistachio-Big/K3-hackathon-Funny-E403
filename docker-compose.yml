# docker-compose.yml — VLearn Tutor stack
# 2 services: app (Node) + qdrant (Vector DB)

services:
  # ============== Qdrant Vector DB ==============
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: vlearn-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============== App server ==============
  app:
    build: ./codebase
    container_name: vlearn-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # API key + config — truyền qua env, không bake vào image
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env or environment}
      GEMINI_MODEL_EMBED: ${GEMINI_MODEL_EMBED:-text-embedding-004}
      GEMINI_MODEL_GEN: ${GEMINI_MODEL_GEN:-gemini-3-flash}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-vlearn_tutor}
      VECTOR_DIM: ${VECTOR_DIM:-768}
      PORT: 3000
    volumes:
      # Mount eval/ để persist cache + chunks nếu sửa data
      - ./codebase/eval:/app/eval
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  qdrant_data:
    name: vlearn_qdrant_data